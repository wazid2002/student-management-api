spring.application.name=college-management-system
spring.datasource.url=jdbc:mysql://localhost:3306/college_database
spring.datasource.username=root
spring.datasource.password=2144Wazid#*

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true



management.endpoints.web.exposure.include=health,info,metrics,env,beans,mapping,loggers
management.endpoint.health.show-details=always
management.endpoints.web.base-path=/actuator


# Port on which your service runs
server.port=8081

# Eureka Server URL
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# Enable registration with Eureka
eureka.client.register-with-eureka=true

# Fetch the registry from Eureka
eureka.client.fetch-registry=true